<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's HW Dashboard</title>

<style>
body { font-family: Arial, sans-serif; margin:10px; position: relative; }
h1 { text-align: center; margin-bottom: 5px; }
#versionLabel { position: absolute; top:10px; right:10px; font-size:12px; font-weight:bold; color:#555; text-align:right; line-height:1.4; }
#saveStatus { text-align:center; margin-bottom:10px; font-weight:bold; }
.summary { background:#f4f6f8; padding:12px; border-radius:12px; margin-bottom:20px; }
.summary li { font-weight:bold; padding:4px 0; }
.table-wrapper { overflow-x:auto; }
table { border-collapse:collapse; width:100%; }
th, td { border:1px solid #ddd; padding:8px; }
th { background:#f0f0f0; }
.past-due { background-color:#ff0000; }
.submitted { background-color: purple; color: white; }
.verified { background-color: green; color: white; }
select { padding:4px; border-radius:6px; }
input[type="checkbox"] { width:20px; height:20px; }
.mobile-group { margin-bottom:20px; }
.mobile-date { font-size:18px; font-weight:bold; padding:10px; background:#e9ecef; border-radius:10px; cursor:pointer; }
.mobile-cards { margin-top:10px; display:none; }
.card { border:1px solid #ddd; border-radius:12px; padding:12px; margin-bottom:10px; }
.card.past-due { background-color:#ffe5e5; }
@media (max-width:768px){ .desktop-view { display:none; } }
@media (min-width:769px){ .mobile-view { display:none; } }

/* ===== Row Status Colors ===== */

.status-completed {
  background-color: #e6ccff;  /* light purple */
}

.status-submitted {
  background-color: #6a0dad;  /* dark purple */
  color: white;
}

.status-verified {
  background-color: #90EE90;  /* green */
  color: white;
}

/* ===== Date Group Borders ===== */

.group-notstarted { border-left: 8px solid #ff0000; }  /* red */
.group-completed  { border-left: 8px solid #b266ff; }  /* light purple */
.group-submitted  { border-left: 8px solid #6a0dad; }  /* dark purple */
.group-verified   { border-left: 8px solid #90EE90; }  /* green */

/* ===== Column Sizing & Alignment ===== */

/* Fixed column widths */
th:nth-child(1), td:nth-child(1) { width:90px; text-align:center; } /* UID */
th:nth-child(2), td:nth-child(2) { width:110px; text-align:center; } /* Date */
th:nth-child(3), td:nth-child(3) { width:275px; } /* Class / Assignment */
th:nth-child(4), td:nth-child(4) { width:350px; } /* Class / Assignment */
th:nth-child(5), td:nth-child(5) { width:120px; text-align:center; } /* Andrew */
/* Canvas is now free‑form text; give more room and left align */
th:nth-child(6), td:nth-child(6) { 
  width:120px; 
  text-align:left;   /* Canvas text */
}
th:nth-child(7), td:nth-child(7) { 
  width:70px; 
  text-align:center;   /* Verified */
}

/* Center checkboxes cleanly */
td input[type="checkbox"] {
  display:block;
  margin:0 auto;
}

/* ===== Scroll Container ===== */
.table-wrapper {
  overflow-x: auto;
  overflow-y: auto;
  max-height: 70vh;   /* adjust height as desired */
  position: relative;
}

/* ===== Sticky Header ===== */
th {
  position: sticky;
  top: 0;
  background: #f0f0f0;   /* must re-declare background */
  z-index: 5;
}

/* Ensure proper layout */
table {
  table-layout: fixed;
  width: 100%;
  border-collapse: collapse;
}
  
</style>
</head>
<body>

<h1>Andrew's HW Dashboard</h1>

<div id="versionLabel">
  <div>Dashboard: v4.4.0 (Google Sheets)</div>
  <div id="dataVersion"></div>
</div>


<div id="saveStatus"></div>
<div id="content"></div>

<script>

// ================= CONFIG =================
const API_URL = "https://script.google.com/macros/s/AKfycbxtV0hB9582D511FEqV-jjWZ3fqRInNTYSdMiB2npYDYWB_5j_5PcungZVlkroVZRyL/exec";


let windowData = [];
let headers = [];

// ================= LOAD DATA =================
async function loadData() {
  const res = await fetch(API_URL);
  const json = await res.json();

  // ensure data exists
  const rawData = Array.isArray(json.data) ? json.data : [];

  
  windowData = rawData.map(r => ({
    ...r,
    Date: formatDate(r.Date)  // convert ISO to MM/DD/YY
  }));
  //windowData = json.data;
  headers = Object.keys(windowData[0] || {});

  // update version labels
  document.getElementById("dataVersion").textContent =
    `${json.fileVersion || "?"} | API ${json.apiVersion || "?"}`;
}

// ================= HELPERS ===============
function formatDate(isoString) {
  if (!isoString) return "";
  const d = new Date(isoString);
  const month = d.getMonth() + 1; // months 0-11
  const day = d.getDate();
  const year = String(d.getFullYear()).slice(-2); // last 2 digits
  return `${month}/${day}/${year}`;
}

// ================= LOGIC =================
function isAndrewDone(val){
  return ["completed","submitted"].includes(
    String(val || "").toLowerCase()
  );
}

function isGroupPastDue(dateString){
  const today = new Date();
  today.setHours(0,0,0,0);

  const [m,d,y] = dateString.split("/");
  const groupDate = new Date("20"+y, m-1, d);

  return groupDate < today;
}

function isRowPastDue(row){
  const today=new Date(); 
  today.setHours(0,0,0,0);

  const rowDate=new Date(row.Date);

  const canvasVal = String(row["Canvas"] || "");
  const verifiedVal = String(row["Verified"]);

  return rowDate<today &&
    (!isAndrewDone(row["Andrew"]) ||
    !canvasVal.startsWith("[") ||
    verifiedVal !== "true");
} 

function getRowStatusRank(row){
  const andrew = String(row["Andrew"] || "").toLowerCase();
  const verified = String(row["Verified"] || "") === "true";

  if (verified) return 4;
  if (andrew === "submitted") return 3;
  if (andrew === "completed") return 2;
  return 1; // not started / in progress
}

function getRowStatusClass(row){
  const rank = getRowStatusRank(row);
  if (rank === 4) return "status-verified";
  if (rank === 3) return "status-submitted";
  if (rank === 2) return "status-completed";
  return "";
}

function getGroupClass(rows){
  let lowest = 4;
  rows.forEach(r => {
    const rank = getRowStatusRank(r);
    if (rank < lowest) lowest = rank;
  });

  if (lowest === 4) return "group-verified";
  if (lowest === 3) return "group-submitted";
  if (lowest === 2) return "group-completed";
  return "group-notstarted";
}

function aggregateCounts(data){
  const today=new Date(); 
  today.setHours(0,0,0,0);

  const counts={andrew:0,canvas:0,verified:0};

  data.forEach(r=>{
    const rowDate=new Date(r.Date);

    if(rowDate<today){

      const canvasVal = String(r["Canvas"] || "");
      const verifiedVal = String(r["Verified"]);

      if(!isAndrewDone(r["Andrew"])) counts.andrew++;
      if(!canvasVal.startsWith("[")) counts.canvas++;
      if(verifiedVal !== "true") counts.verified++;
    }
  });

  return counts;
} 

// ================= SAVE =================
function triggerSave(row){
  document.getElementById("saveStatus").textContent="Saving...";

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(row)
  })
  .then(()=>{
    document.getElementById("saveStatus").textContent="Saved ✓";
    setTimeout(()=>document.getElementById("saveStatus").textContent="",2000);
  })
  .catch(()=>{
    document.getElementById("saveStatus").textContent="Save Failed ❌";
  });
}

// ================= RENDER =================
function groupByDate(data){
  const groups={};
  data.forEach(r=>{
    if(!groups[r.Date]) groups[r.Date]=[];
    groups[r.Date].push(r);
  });
  return groups;
}

function renderSummary(){
  const container=document.getElementById("content");
  const counts=aggregateCounts(windowData);
  const div=document.createElement("div");
  div.className="summary";
  div.innerHTML=`
    <h2>Past Due Status</h2>
    <ul>
      <li>Andrew Missing: ${counts.andrew}</li>
      <li>Canvas Missing: ${counts.canvas}</li>
      <li>Verified Missing: ${counts.verified}</li>
    </ul>`;
  container.appendChild(div);
}

function renderTable(){
  const container=document.getElementById("content");
  container.innerHTML="";
  renderSummary();

  const groups=groupByDate(windowData);

  Object.keys(groups)
  .sort((a,b)=>{
    const [am,ad,ay]=a.split("/");
    const [bm,bd,by]=b.split("/");
    return new Date(ay,am-1,ad)-new Date(by,bm-1,bd);
  })
  .forEach(date=>{
    const rows=groups[date];
    const groupClass = isGroupPastDue(date) ? getGroupClass(rows) : "";

    /* ================= DESKTOP ================= */
    const desktopDiv=document.createElement("div");
    desktopDiv.className="desktop-view " + groupClass;

    const tableWrapper=document.createElement("div");
    tableWrapper.className="table-wrapper";

    const table=document.createElement("table");
    table.innerHTML="<tr>"+headers.filter(h=>h!=="Event").map(h=>`<th>${h}</th>`).join("")+"</tr>";

    rows.forEach((row)=>{
      const statusClass = getRowStatusClass(row);
      let rowHTML = `<tr class="${statusClass} ${isRowPastDue(row) ? 'past-due' : ''}">`;

      headers.forEach(h=>{
        if(h==="Event") return;

        if(h==="Andrew"){
          let current=row[h]||"Not Started";
          rowHTML+=`<td>
            <select onchange="updateAndrew(${windowData.indexOf(row)},this.value)">
              <option ${current==="Not Started"?"selected":""}>Not Started</option>
              <option ${current==="In Progress"?"selected":""}>In Progress</option>
              <option ${current==="Completed"?"selected":""}>Completed</option>
              <option ${current==="Submitted"?"selected":""}>Submitted</option>
            </select>
          </td>`;
        }
        else if(h==="Canvas"){
          const current = row[h] || "";
          rowHTML+=`<td>
            <input type="text" value="${current}"
              onchange="updateCanvas(${windowData.indexOf(row)},this.value)">
          </td>`;
        }
        else if(h==="Verified"){
          const checked=String(row[h]||"").toLowerCase()==="true";
          rowHTML+=`<td>
            <input type="checkbox" ${checked?"checked":""}
              onchange="updateCheckbox(${windowData.indexOf(row)},'Verified',this.checked)">
          </td>`;
        }

    const cardsContainer = document.createElement("div");
    cardsContainer.className = "mobile-cards";

    dateHeader.onclick = () => {
      cardsContainer.style.display =
        cardsContainer.style.display === "block" ? "none" : "block";
    };

    rows.forEach((row)=>{
      const statusClass = getRowStatusClass(row);
      const card = document.createElement("div");
      card.className = `card ${statusClass} ${isRowPastDue(row) ? 'past-due' : ''}`;

      const rowIndex = windowData.indexOf(row);
      const current = row["Andrew"] || "Not Started";
      const canvasVal = row["Canvas"] || "";
      const verifiedChecked = String(row["Verified"]).toLowerCase() === "true";

      card.innerHTML = `
        <div><strong>${row["Class"] || ""}</strong></div>
        <div>${row["Assignment"] || ""}</div>
        <div style="margin-top:8px;">
          <select onchange="updateAndrew(${rowIndex},this.value)">
            <option ${current==="Not Started"?"selected":""}>Not Started</option>
            <option ${current==="In Progress"?"selected":""}>In Progress</option>
            <option ${current==="Completed"?"selected":""}>Completed</option>
            <option ${current==="Submitted"?"selected":""}>Submitted</option>
          </select>
        </div>
        <div style="margin-top:8px;">
          Canvas 
          <input type="text" value="${canvasVal}"
            onchange="updateCanvas(${rowIndex},this.value)">
          &nbsp;&nbsp;
          Verified 
          <input type="checkbox" ${verifiedChecked?"checked":""}
            onchange="updateCheckbox(${rowIndex},'Verified',this.checked)">
        </div>
      `;

      cardsContainer.appendChild(card);
    });

    mobileGroup.appendChild(dateHeader);
    mobileGroup.appendChild(cardsContainer);
    container.appendChild(mobileGroup);
  });
}

// ================= UPDATE FUNCTIONS =================
function updateAndrew(rowIndex,value){
  windowData[rowIndex]["Andrew"]=value;
  triggerSave(windowData[rowIndex]);
}

function updateCheckbox(rowIndex,col,value){
  windowData[rowIndex][col]=value?"true":"false";
  triggerSave(windowData[rowIndex]);
}

function updateCanvas(rowIndex,value){
  windowData[rowIndex]["Canvas"] = value;
  triggerSave(windowData[rowIndex]);
} 

// ================= INIT =================
(async function(){
  await loadData();
  renderTable();
})();
</script>

</body>
</html>
