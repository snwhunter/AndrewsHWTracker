<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's HW Dashboard</title>

<style>
body { font-family: Arial, sans-serif; margin:0; display:flex; flex-direction:column; height:100vh; }
header { position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid #ddd; }
h1 { text-align:center; margin:0; padding:5px; }
#header-info { display:flex; justify-content:space-between; padding:5px 10px; font-size:14px; font-weight:bold; }
#banner { text-align:center; margin:5px 0; font-weight:bold; }
.summary { background:#f4f6f8; padding:5px 10px; border-radius:8px; display:flex; justify-content:space-around; font-size:14px; margin-top:5px; }
table { border-collapse:collapse; width:100%; table-layout:fixed; }
th:nth-child(1), td:nth-child(1) { width:90px; }   /* Class */
th:nth-child(2), td:nth-child(2) { width:320px; }  /* Assignment */
th:nth-child(3), td:nth-child(3) { width:110px; }  /* DueDate */
th:nth-child(4), td:nth-child(4) { width:110px; }  /* Status */
th:nth-child(5), td:nth-child(5) { width:80px; }   /* Checkbox */
th, td { border:1px solid #ddd; padding:8px; }
th { position:sticky; top:0; background:#f0f0f0; z-index:5; }
.past-due { background-color:#ff0000; }
select { padding:4px; border-radius:6px; }
input[type="checkbox"] { width:20px; height:20px; }
@media (max-width:768px){ .desktop-view { display:none; } }
@media (min-width:769px){ .mobile-view { display:none; } }
.status-followingup { background:#fff3a0; }
.status-completed { background:#e6ccff; }
.status-submitted { background:#6a0dad; color:white; }
.status-verified { background:#90EE90; color:white; }
.group-notstarted { border-left:8px solid #ff0000; }
.group-followingup { border-left:8px solid #ffd600; }
.group-completed { border-left:8px solid #b266ff; }
.group-submitted { border-left:8px solid #6a0dad; }
.group-verified { border-left:8px solid #90EE90; }
#content { overflow-y:auto; flex:1; padding:10px; }
.table-wrapper { overflow-x:auto; }
</style>
</head>

<body>

<header>
<h1>Andrew's HW Dashboard</h1>

<div id="header-info">
  <div id="versionLabel">Dashboard: ? | API: ?</div>
  <div class="summary"><div>:Summary:</div></div>
  <div id="lastUpdated"></div>
</div>
</header>

<div id="banner"></div>
<div id="content">Loading...</div>

<script>
const VERSION="4.9.7";
const API_URL="https://script.google.com/macros/s/AKfycbxtV0hB9582D511FEqV-jjWZ3fqRInNTYSdMiB2npYDYWB_5j_5PcungZVlkroVZRyL/exec";
let windowData=[], headers=[];

/* SAFARI-SAFE DATE PARSER */
function parseMDY(dateString){ if(!dateString) return null; const [m,d,y]=dateString.split("/"); return new Date("20"+y, m-1, d); }
function formatDate(iso){ if(!iso) return ""; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`; }

/* STATUS HELPERS */
function isAndrewDone(val){ return ["completed","submitted"].includes(String(val||"").toLowerCase()); }
function isCanvasComplete(val){ return typeof val==="string" && val.trim().startsWith("["); }
function isGroupPastDue(dateString){ const today=new Date(); today.setHours(0,0,0,0); return parseMDY(dateString)<today; }
function isRowPastDue(row){ const today=new Date(); today.setHours(0,0,0,0); const rowDate=row.ParsedDate; const canvasComplete=isCanvasComplete(row["Canvas"]); const verifiedVal=String(row["Verified"]); return rowDate<today && (!isAndrewDone(row["Andrew"]) || !canvasComplete || verifiedVal!=="true"); }
function getRowStatusRank(row){ const andrew=String(row["Andrew"]||"").toLowerCase(); const canvasComplete=isCanvasComplete(row["Canvas"]); const verified=String(row["Verified"])==="true"; if(verified) return 5; if(andrew==="submitted" && canvasComplete) return 4; if(andrew==="completed") return 3; if(andrew==="following up") return 2; return 1; }
function getRowStatusClass(row){ const andrew=String(row["Andrew"]||"").toLowerCase(); const rank=getRowStatusRank(row); if(rank===5) return "status-verified"; if(rank===4) return "status-submitted"; if(rank===3) return "status-completed"; if(andrew==="following up") return "status-followingup"; return ""; }
function getGroupClass(rows){ let lowest=5; rows.forEach(r=>{ const rank=getRowStatusRank(r); if(rank<lowest) lowest=rank; }); if(lowest===5) return "group-verified"; if(lowest===4) return "group-submitted"; if(lowest===3) return "group-completed"; if(lowest===2) return "group-followingup"; return "group-notstarted"; }

/* SUMMARY */
function updateSummary(){
  const counts={andrew:0,canvas:0,verified:0};
  const today=new Date(); today.setHours(0,0,0,0);
  windowData.forEach(r=>{ const rowDate=r.ParsedDate; if(rowDate<today){ if(!isAndrewDone(r["Andrew"])) counts.andrew++; if(!isCanvasComplete(r["Canvas"])) counts.canvas++; if(String(r["Verified"])!=="true") counts.verified++; }});
  const summaryDiv=document.querySelector("#header-info .summary");
  summaryDiv.innerHTML=`<div>Andrew Missing: ${counts.andrew}</div><div>| Canvas Missing: ${counts.canvas}</div><div>| Verified Missing: ${counts.verified}</div>`;
}

/* SAVE */
function triggerSave(rowData,rowIndex){
  document.getElementById("banner").textContent=`Saving [${rowIndex}] UID:${rowData.UID}`;
  fetch(API_URL,{method:"POST",body:JSON.stringify({...rowData,UID:rowData.UID})})
  .then(()=>{ document.getElementById("banner").textContent="Saved ✓"; refreshRowUI(rowIndex); setTimeout(()=>document.getElementById("banner").textContent="",2000); })
  .catch(()=>{ document.getElementById("banner").textContent="Save Failed ❌"; });
}
function refreshRowUI(rowIndex){
  const row=windowData[rowIndex]; const rows=document.querySelectorAll("tbody tr"); const tr=rows[rowIndex]; if(!tr) return;
  tr.classList.remove("status-followingup","status-completed","status-submitted","status-verified");
  tr.classList.add(getRowStatusClass(row));
  tr.classList.toggle("past-due",isRowPastDue(row));
  updateSummary();
}

/* GROUP */
function groupByDate(data){ const groups={}; data.forEach(r=>{ if(!groups[r.Date]) groups[r.Date]=[]; groups[r.Date].push(r); }); return groups; }

/* RENDER */
function renderTable(){
  const container=document.getElementById("content"); container.innerHTML="";
  const groups=groupByDate(windowData);
  Object.keys(groups).sort((a,b)=>parseMDY(a)-parseMDY(b)).forEach(date=>{
    const rows=groups[date]; const groupClass=isGroupPastDue(date)?getGroupClass(rows):"";
    const desktopDiv=document.createElement("div"); desktopDiv.className="desktop-view "+groupClass;
    const tableWrapper=document.createElement("div"); tableWrapper.className="table-wrapper";
    const table=document.createElement("table");
    table.innerHTML="<thead><tr>"+headers.filter(h=>h!=='Event'&&h!=='ParsedDate').map(h=>`<th>${h}</th>`).join("")+"</tr></thead><tbody></tbody>";
    let rowsHTML="";
    rows.forEach(row=>{
      const statusClass=getRowStatusClass(row);
      let rowHTML=`<tr class="${statusClass} ${isRowPastDue(row)?'past-due':''}">`;
      headers.forEach(h=>{
        if(h==="Event"||h==="ParsedDate") return;
        else if(h==="Andrew"){
          const current=row[h]||"";
          rowHTML+=`<td><select onchange="updateAndrew('${row.UID}',this.value)"><option value=""></option><option ${current==="In Progress"?"selected":""}>In Progress</option><option ${current==="Following Up"?"selected":""}>Following Up</option><option ${current==="Completed"?"selected":""}>Completed</option><option ${current==="Submitted"?"selected":""}>Submitted</option></select></td>`;
        }
        else if(h==="Canvas"){ rowHTML+=`<td>${row[h]||""}</td>`; }
        else if(h==="Verified"){ const checked=String(row[h])==="true"; rowHTML+=`<td><input type="checkbox" ${checked?"checked":""} onchange="updateCheckbox('${row.UID}','Verified',this.checked)"></td>`; }
        else{ rowHTML+=`<td>${row[h]}</td>`; }
      });
      rowHTML+="</tr>"; rowsHTML+=rowHTML;
    });
    table.querySelector("tbody").innerHTML = rowsHTML;
    desktopDiv.innerHTML=`<h2>${date}</h2>`; tableWrapper.appendChild(table); desktopDiv.appendChild(tableWrapper); container.appendChild(desktopDiv);
  });
}

/* UPDATE */
function updateAndrew(uid,value){ const rowIndex=windowData.findIndex(r=>r.UID===uid); if(rowIndex===-1) return; windowData[rowIndex]["Andrew"]=value; triggerSave(windowData[rowIndex],rowIndex); }
function updateCheckbox(uid,col,value){ const rowIndex=windowData.findIndex(r=>r.UID===uid); if(rowIndex===-1) return; windowData[rowIndex][col]=value?"true":"false"; triggerSave(windowData[rowIndex],rowIndex); }

/* LOCAL STORAGE + LAST UPDATED */
async function loadData(){
  const content=document.getElementById("content"); content.innerHTML="Loading...";
  const cached=localStorage.getItem("hwTrackerCache");
  if(cached){ try{ const json=JSON.parse(cached); useData(json,true); }catch(e){ console.warn("Failed to parse cache",e); } }
  try{
    const res=await fetch(API_URL,{method:"GET",mode:"cors",cache:"no-store"});
    if(!res.ok) throw new Error("API response not OK");
    const json=await res.json();
    localStorage.setItem("hwTrackerCache",JSON.stringify(json));
    useData(json,false);
  }catch(err){ console.error("API LOAD ERROR:",err); if(!cached) content.innerHTML="❌ Failed to load data"; }
}

function useData(json, fromCache){
  const rawData = Array.isArray(json.data)?json.data:[];
  windowData = rawData.map((r,i)=>{
    const formatted=formatDate(r.Date);
    return {...r, Date:formatted, ParsedDate:parseMDY(formatted), UID:String(r.UID??i)};
  });
  headers=Object.keys(windowData[0]||{});
  document.getElementById("versionLabel").textContent=`Dashboard: v${VERSION}| File: ${json.fileVersion||"?"} | API: ${json.apiVersion||"?"}`;
  const lastUpdatedDiv=document.getElementById("lastUpdated");
  const now=new Date(); const timeStr=now.toLocaleDateString()+" "+now.toLocaleTimeString();
  lastUpdatedDiv.textContent=fromCache ? `Last Updated (cached): ${timeStr}` : `Last Updated (fresh): ${timeStr}`;
  renderTable(); updateSummary();
}

/* INIT */
(async function(){ await loadData(); })();

</script>
</body>
</html>
