<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew's HW Dashboard</title>

<style>
body { font-family: Arial, sans-serif; margin:0; display:flex; flex-direction:column; height:100vh; }
header { position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid #ddd; }
h1 { text-align:center; margin:0; padding:5px; }

#header-info { display:flex; justify-content:space-between; padding:5px 10px; font-size:14px; font-weight:bold; }
.summary { background:#f4f6f8; padding:5px 10px; border-radius:8px; display:flex; justify-content:space-around; font-size:14px; margin-top:5px; }
.filter-bar { display:flex; justify-content:center; align-items:center; gap:8px; padding:0 10px 8px; font-size:14px; }

#content { overflow-y:auto; flex:1; padding:10px; }

table { border-collapse:collapse; width:100%; table-layout:fixed; }
th, td { border:1px solid #ddd; padding:8px; }
th { position:sticky; top:0; background:#f0f0f0; }

th:nth-child(1), td:nth-child(1) { width:90px; text-align:center; }
th:nth-child(2), td:nth-child(2) { width:110px; text-align:center; }
th:nth-child(3), td:nth-child(3) { width:200px; }
th:nth-child(4), td:nth-child(4) { width:350px; }
th:nth-child(5), td:nth-child(5) { width:120px; text-align:center; }
th:nth-child(6), td:nth-child(6) { width:120px; text-align:center; }
th:nth-child(7), td:nth-child(7) { width:70px; text-align:center; }

.table-wrapper { overflow-x:auto; }

.card{
border:1px solid #ddd;
border-radius:10px;
padding:10px;
margin:10px 0;
}

.mobile-date{
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

.past-due { background:#ff0000; }

.status-followingup { background:#fff3a0; }
.status-completed { background:#e6ccff; }
.status-submitted { background:#6a0dad; color:white; }
.status-verified { background:#90EE90; }

.group-notstarted { border-left:8px solid #ff0000; padding-left:6px; }
.group-followingup { border-left:8px solid #ffd600; padding-left:6px; }
.group-completed { border-left:8px solid #b266ff; padding-left:6px; }
.group-submitted { border-left:8px solid #6a0dad; padding-left:6px; }
.group-verified { border-left:8px solid #90EE90; padding-left:6px; }

select{ padding:4px; border-radius:6px; }
input[type="checkbox"]{ width:20px;height:20px;}
.notes-input{ width:100%; box-sizing:border-box; }

@media (max-width:768px){
.desktop-view{display:none;}
}

@media (min-width:769px){
.mobile-view{display:none;}
}

</style>
</head>

<body>

<header>
<h1>Andrew's HW Dashboard</h1>

<div id="header-info">
<div id="versionLabel">Dashboard: ? | API: ?</div>
<div class="summary"></div>
<div id="lastUpdated"></div>
</div>

<div class="filter-bar">
<label for="classFilter"><b>Class:</b></label>
<select id="classFilter" onchange="applyClassFilter(this.value)">
<option value="">All Classes</option>
</select>
</div>
</header>

<div id="banner"></div>
<div id="content">Loading...</div>

<script>

const VERSION="5.1.0";
const API_URL="https://script.google.com/macros/s/AKfycbxtV0hB9582D511FEqV-jjWZ3fqRInNTYSdMiB2npYDYWB_5j_5PcungZVlkroVZRyL/exec";

let allData=[];
let windowData=[];
let headers=[];
let activeClassFilter="";

/* DATE PARSER */

function parseMDY(s){
if(!s) return null;
const [m,d,y]=s.split("/");
return new Date("20"+y,m-1,d);
}

function formatDate(iso){
if(!iso) return "";
const d=new Date(iso);
return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`;
}

function escapeAttr(v){
return String(v||"")
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

/* STATUS */

function isAndrewDone(v){
return ["completed","submitted"].includes(String(v||"").toLowerCase());
}

function isCanvasComplete(v){
return typeof v==="string" && v.trim().startsWith("[");
}

function isGroupPastDue(d){
const t=new Date(); t.setHours(0,0,0,0);
return parseMDY(d)<t;
}

function isRowPastDue(row){
const t=new Date(); t.setHours(0,0,0,0);
return row.ParsedDate<t &&
(!isAndrewDone(row.Andrew) ||
!isCanvasComplete(row.Canvas) ||
String(row.Verified)!=="true");
}

function getRowStatusRank(r){
const a=String(r.Andrew||"").toLowerCase();
const canvas=isCanvasComplete(r.Canvas);
const v=String(r.Verified)==="true";

if(v) return 5;
if(a==="submitted" && canvas) return 4;
if(a==="completed") return 3;
if(a==="following up") return 2;
return 1;
}

function getRowStatusClass(r){

const rank=getRowStatusRank(r);

if(rank===5) return "status-verified";
if(rank===4) return "status-submitted";
if(rank===3) return "status-completed";

if(String(r.Andrew).toLowerCase()==="following up")
return "status-followingup";

return "";
}

function getGroupClass(rows){
let lowest=5;
rows.forEach(r=>{
const rank=getRowStatusRank(r);
if(rank<lowest) lowest=rank;
});

if(lowest===5) return "group-verified";
if(lowest===4) return "group-submitted";
if(lowest===3) return "group-completed";
if(lowest===2) return "group-followingup";
return "group-notstarted";
}

/* SUMMARY */

function updateSummary(){

const counts={andrew:0,canvas:0,verified:0};
const today=new Date(); today.setHours(0,0,0,0);

windowData.forEach(r=>{
if(r.ParsedDate<today){
if(!isAndrewDone(r.Andrew)) counts.andrew++;
if(!isCanvasComplete(r.Canvas)) counts.canvas++;
if(String(r.Verified)!=="true") counts.verified++;
}
});

document.querySelector(".summary").innerHTML=
`Andrew Missing: ${counts.andrew} |
Canvas Missing: ${counts.canvas} |
Verified Missing: ${counts.verified}`;

}

function populateClassFilter(){
const select=document.getElementById("classFilter");
const classes=[...new Set(allData.map(r=>String(r.Class||"").trim()).filter(Boolean))]
.sort((a,b)=>a.localeCompare(b));

select.innerHTML='<option value="">All Classes</option>'+
classes.map(c=>`<option value="${escapeAttr(c)}">${c}</option>`).join("");

select.value=activeClassFilter;
}

function applyClassFilter(className){
activeClassFilter=className;
windowData=activeClassFilter
?allData.filter(r=>String(r.Class||"").trim()===activeClassFilter)
:allData;

render();
}

/* GROUP */

function groupByDate(data){
const g={};
data.forEach(r=>{
if(!g[r.Date]) g[r.Date]=[];
g[r.Date].push(r);
});
return g;
}

/* RENDER */

function render(){

const container=document.getElementById("content");

const groups=groupByDate(windowData);

let html="";

Object.keys(groups)
.sort((a,b)=>parseMDY(a)-parseMDY(b))
.forEach(date=>{

const rows=groups[date];
const groupClass=isGroupPastDue(date)?getGroupClass(rows):"";

/* DESKTOP */

let tableRows="";

rows.forEach(row=>{

const status=getRowStatusClass(row);
const past=isRowPastDue(row)?"past-due":"";

tableRows+=`
<tr class="${status} ${past}">
<td>${row.Date}</td>
<td>${row.Class||""}</td>
<td>${row.Assignment||""}</td>
<td>
<input
class="notes-input"
value="${escapeAttr(row.Notes)}"
onchange="updateNotes('${row.UID}',this.value)">
</td>

<td>
<select onchange="updateAndrew('${row.UID}',this.value)">
<option></option>
<option ${row.Andrew==="In Progress"?"selected":""}>In Progress</option>
<option ${row.Andrew==="Following Up"?"selected":""}>Following Up</option>
<option ${row.Andrew==="Completed"?"selected":""}>Completed</option>
<option ${row.Andrew==="Submitted"?"selected":""}>Submitted</option>
</select>
</td>

<td>${row.Canvas||""}</td>

<td>
<input type="checkbox"
${String(row.Verified)==="true"?"checked":""}
onchange="updateCheckbox('${row.UID}','Verified',this.checked)">
</td>
</tr>
`;

});

/* MOBILE */

let mobileCards="";

rows.forEach(row=>{

const status=getRowStatusClass(row);
const past=isRowPastDue(row)?"past-due":"";

mobileCards+=`
<div class="card ${status} ${past}">

<div><b>${row.Class||""}</b></div>
<div>${row.Assignment||""}</div>

<div>Canvas: ${row.Canvas||""}</div>

<div style="margin-top:6px">
<select onchange="updateAndrew('${row.UID}',this.value)">
<option></option>
<option ${row.Andrew==="In Progress"?"selected":""}>In Progress</option>
<option ${row.Andrew==="Following Up"?"selected":""}>Following Up</option>
<option ${row.Andrew==="Completed"?"selected":""}>Completed</option>
<option ${row.Andrew==="Submitted"?"selected":""}>Submitted</option>
</select>
</div>

<div style="margin-top:6px">
Verified
<input type="checkbox"
${String(row.Verified)==="true"?"checked":""}
onchange="updateCheckbox('${row.UID}','Verified',this.checked)">
</div>

<div style="margin-top:6px">
<b>Notes:</b>
<input
class="notes-input"
value="${escapeAttr(row.Notes)}"
onchange="updateNotes('${row.UID}',this.value)">
</div>

</div>
`;

});

html+=`

<div class="desktop-view ${groupClass}">
<h2>${date}</h2>

<div class="table-wrapper">

<table>
<thead>
<tr>
<th>Date</th>
<th>Class</th>
<th>Assignment</th>
<th>Notes</th>
<th>Andrew</th>
<th>Canvas</th>
<th>Verified</th>
</tr>
</thead>

<tbody>
${tableRows}
</tbody>

</table>
</div>
</div>

<div class="mobile-view ${groupClass}">

<div class="mobile-date"
onclick="this.nextElementSibling.style.display =
this.nextElementSibling.style.display==='block'?'none':'block'">

${date}

</div>

<div style="display:none">

${mobileCards}

</div>

</div>
`;

});

container.innerHTML=html;

updateSummary();

}

/* SAVE */

function triggerSave(row){

fetch(API_URL,{
method:"POST",
body:JSON.stringify(row)
});

}

/* UPDATE */

function updateAndrew(uid,value){

const row=windowData.find(r=>r.UID===uid);
if(!row) return;

row.Andrew=value;

triggerSave(row);

render();

}

function updateCheckbox(uid,col,val){

const row=windowData.find(r=>r.UID===uid);
if(!row) return;

row[col]=val?"true":"false";

triggerSave(row);

render();

}

function updateNotes(uid,value){

const row=windowData.find(r=>r.UID===uid);
if(!row) return;

row.Notes=value;

triggerSave(row);

render();

}

/* LOAD */

async function loadData(){

const content=document.getElementById("content");

const cached=localStorage.getItem("hwTrackerCache");

if(cached){

try{
const json=JSON.parse(cached);
useData(json,true);
}catch{}

}

try{

const res=await fetch(API_URL,{cache:"no-store"});
const json=await res.json();

localStorage.setItem("hwTrackerCache",JSON.stringify(json));

useData(json,false);

}catch(e){

if(!cached)
content.innerHTML="Failed to load data";

}

}

function useData(json,fromCache){

const raw=Array.isArray(json.data)?json.data:[];

allData=raw.map((r,i)=>{

const formatted=formatDate(r.Date);

return {
...r,
Date:formatted,
ParsedDate:parseMDY(formatted),
UID:String(r.UID??i)
};

});

if(activeClassFilter && !allData.some(r=>String(r.Class||"").trim()===activeClassFilter))
activeClassFilter="";

populateClassFilter();

windowData=activeClassFilter
?allData.filter(r=>String(r.Class||"").trim()===activeClassFilter)
:allData;

headers=Object.keys(allData[0]||{});

document.getElementById("versionLabel").textContent=
`Dashboard v${VERSION} | API ${json.apiVersion||"?"}`;

const now=new Date();

document.getElementById("lastUpdated").textContent=
(fromCache?"Cached ":"Updated ")+
now.toLocaleDateString()+" "+
now.toLocaleTimeString();

render();

}

/* INIT */

loadData();

</script>
</body>
</html>
